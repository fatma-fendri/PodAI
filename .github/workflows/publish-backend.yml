name: Publish backend image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/publish-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/fatma-fendri/podai-backend:latest
            ghcr.io/fatma-fendri/podai-backend:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update the container app
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name podai-backend \
            --resource-group rg-podai-demo \
            --image ghcr.io/fatma-fendri/podai-backend:${{ github.sha }}
